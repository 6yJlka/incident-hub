spring:
  application:
    name: incident-hub

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/incident_hub}
    username: ${DB_USERNAME:incident_user}
    password: ${DB_PASSWORD:incident_password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
