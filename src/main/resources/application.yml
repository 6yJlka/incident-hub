spring:
  application:
    name: incident-hub

  profiles:
    group:
      demo: local

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/incident_hub}
    username: ${DB_USERNAME:incident_user}
    password: ${DB_PASSWORD:incident_password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT1H}
      allow-local-secret: false

---
spring:
  config:
    activate:
      on-profile: local

app:
  security:
    jwt:
      secret: ${JWT_SECRET:aW5jaWRlbnQtaHViLWxvY2FsLWRldmVsb3BtZW50LXNlY3JldC0yMDI2}
