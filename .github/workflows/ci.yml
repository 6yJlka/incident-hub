name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build and test
        run: ./gradlew clean build

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 7

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check generated API client
        working-directory: frontend
        run: npm run api:check

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Test frontend
        working-directory: frontend
        run: npm run test

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker:
    name: Build and smoke-test Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, frontend]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build Docker images
        run: docker compose build

      - name: Start demo stack
        env:
          SPRING_PROFILES_ACTIVE: demo
        run: docker compose up --detach --wait --wait-timeout 120

      - name: Verify packaged security configuration through nginx
        run: |
          curl --fail-with-body --silent --show-error \
            --header 'Content-Type: application/json' \
            --header 'Origin: http://localhost:3000' \
            --data '{"email":"anna.ivanova@incidenthub.demo","password":"demo1234"}' \
            --output /tmp/login-response.json \
            http://localhost:3000/api/v1/auth/login
          grep --quiet '"accessToken"' /tmp/login-response.json
          ! docker compose logs app | grep --quiet 'Using generated security password'

      - name: Publish compose logs
        if: always()
        run: docker compose logs --no-color > compose.log

      - name: Upload compose logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compose-log
          path: compose.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop demo stack
        if: always()
        run: docker compose down --volumes
