services:
  postgres:
    image: postgres:16-alpine
    container_name: incident-hub-postgres
    environment:
      POSTGRES_DB: incident_hub
      POSTGRES_USER: incident_user
      POSTGRES_PASSWORD: incident_password
    ports:
      - "5433:5432"
    volumes:
      - incident-hub-postgres-data:/var/lib/postgresql/data

volumes:
  incident-hub-postgres-data:
