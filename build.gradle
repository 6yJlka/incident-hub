plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ru.donskikh'
version = '0.0.1-SNAPSHOT'
description = 'incident-hub'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    experiment {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    test {
        compileClasspath += sourceSets.experiment.output
        runtimeClasspath += sourceSets.experiment.output + configurations.experimentRuntimeClasspath
    }
}

dependencies {
    experimentImplementation 'tools.jackson.core:jackson-databind'
    testImplementation 'com.tngtech.archunit:archunit:1.4.1'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation('io.swagger.parser.v3:swagger-parser-v3:2.1.35') {
        // Reuse springdoc's Jakarta swagger-core/models/annotations without duplicate classes.
        exclude group: 'io.swagger.core.v3'
    }
    testImplementation 'com.networknt:json-schema-validator:1.5.9'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    dependsOn tasks.named('experimentClasses')
}

tasks.register('generateExperiment', JavaExec) {
    group = 'experiment'
    description = 'Generate a reproducible scenario without Spring, HTTP, or a database'
    classpath = sourceSets.experiment.runtimeClasspath
    mainClass = 'ru.donskikh.incidenthub.experiment.cli.ExperimentGeneratorMain'
    dependsOn tasks.named('experimentClasses')
}

tasks.register('verifyExperimentIsolation') {
    dependsOn tasks.named('bootJar')
    doLast {
        def archive = tasks.named('bootJar').get().archiveFile.get().asFile
        def leaked = zipTree(archive).matching { include '**/experiment/**' }.files
        if (!leaked.empty) {
            throw new GradleException("Product archive contains experiment artifacts: ${leaked}")
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyExperimentIsolation')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
}
