map $uri $frontend_cache_control {
    default "";
    /index.html "no-cache";
    "~^/assets/[^/]+-[A-Za-z0-9_-]{8,}\.[^/]+$" "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep headers at server scope so locations inherit the complete header set.
    add_header Cache-Control $frontend_cache_control;

    location ^~ /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        # Keep the browser-visible port so Spring recognizes a same-origin request.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
